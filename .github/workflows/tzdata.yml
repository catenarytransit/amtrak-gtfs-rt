name: Timezone data
on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Require latest IANA release
        run: |
          latest=$(curl --fail --silent --show-error --retry 3 https://data.iana.org/time-zones/tzdb/version)
          LATEST_IANA_TZDB_VERSION="$latest" cargo test --all-targets timezone::tests
